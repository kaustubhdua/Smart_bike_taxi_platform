services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rideforge
      POSTGRES_USER: rideforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rideforge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideforge -d rideforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate-if-needed.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 8080
      RIDEFORGE_BIND_ADDRESS: 0.0.0.0
      RIDEFORGE_ALLOWED_ORIGIN: http://localhost:5173
      RIDEFORGE_USER_AGENT: ${RIDEFORGE_USER_AGENT}
      RIDEFORGE_GEOCODING_URL: ${RIDEFORGE_GEOCODING_URL:-https://nominatim.openstreetmap.org/search}
      RIDEFORGE_ROUTING_URL: ${RIDEFORGE_ROUTING_URL:-https://router.project-osrm.org/route/v1/driving}
      RIDEFORGE_JWT_SECRET: ${RIDEFORGE_JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RIDEFORGE_OUTBOX_POLL_MS: 250
    entrypoint: ["/usr/local/bin/rideforge_outbox_worker"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  rideforge-data:
