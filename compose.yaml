services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: saarthi
      POSTGRES_USER: saarthi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - saarthi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarthi -d saarthi"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate-if-needed.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 8080
      SAARTHI_BIND_ADDRESS: 0.0.0.0
      SAARTHI_ALLOWED_ORIGIN: http://localhost:5173
      SAARTHI_USER_AGENT: ${SAARTHI_USER_AGENT}
      SAARTHI_GEOCODING_URL: ${SAARTHI_GEOCODING_URL:-https://nominatim.openstreetmap.org/search}
      SAARTHI_ROUTING_URL: ${SAARTHI_ROUTING_URL:-https://router.project-osrm.org/route/v1/driving}
      SAARTHI_JWT_SECRET: ${SAARTHI_JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    restart: unless-stopped

volumes:
  saarthi-data:
