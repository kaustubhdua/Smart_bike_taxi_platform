openapi: 3.1.0
info:
  title: Saarthi Ride API
  version: 0.1.0
  description: Contract for the planned API. Routes are not live until the HTTP service and integration tests are implemented.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200": { description: Service healthy }
  /auth/register:
    post:
      security: []
      summary: Register passenger account
      responses:
        "201": { description: Account created }
        "409": { description: Email already exists }
        "422": { description: Invalid request }
  /auth/login:
    post:
      security: []
      summary: Authenticate and issue short-lived access token
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited }
  /routes/quote:
    post:
      security: []
      summary: Calculate a server-authoritative route and fare quote without creating a ride
      description: Public quote requests must be rate-limited. The server must recalculate route and fare; client-supplied distance or price is never authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Route and expiring fare quote returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "422": { description: Invalid location or unreachable route }
        "429": { description: Quote rate limit exceeded }
        "503": { description: Routing provider unavailable }
  /rides:
    post:
      summary: Create an idempotent ride request
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      responses:
        "201": { description: Ride persisted }
        "409": { description: Idempotency conflict or no eligible driver }
        "401": { description: Unauthenticated }
        "422": { description: Invalid request }
  /rides/{rideId}:
    get:
      summary: Read a ride authorized to the authenticated user
      parameters:
        - in: path
          name: rideId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Ride details }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /rides/{rideId}/cancel:
    post:
      summary: Cancel eligible ride and release driver atomically
      responses:
        "200": { description: Ride cancelled }
        "409": { description: Invalid lifecycle transition }
  /driver/availability:
    put:
      summary: Set authenticated driver's availability
      responses:
        "200": { description: Availability updated }
        "403": { description: Driver role required }
  /driver/rides/{rideId}/accept:
    post:
      summary: Atomically accept a matching ride
      responses:
        "200": { description: Ride assigned }
        "409": { description: Another driver won assignment race }
  /driver/rides/{rideId}/status:
    put:
      summary: Advance the assigned driver's ride lifecycle
      responses:
        "200": { description: Lifecycle advanced }
        "409": { description: Invalid transition }
  /admin/metrics:
    get:
      summary: Read operational metrics
      responses:
        "200": { description: Metrics returned }
        "403": { description: Admin role required }
components:
  schemas:
    LocationInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 240
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [pickup, destination]
      properties:
        pickup:
          $ref: "#/components/schemas/LocationInput"
        destination:
          $ref: "#/components/schemas/LocationInput"
    QuoteResponse:
      type: object
      additionalProperties: false
      required: [quoteId, distanceKm, durationMinutes, farePaise, currency, expiresAt]
      properties:
        quoteId:
          type: string
          format: uuid
        distanceKm:
          type: number
          minimum: 0
        durationMinutes:
          type: integer
          minimum: 0
        farePaise:
          type: integer
          minimum: 0
          description: Integer paise, never floating-point rupees.
        currency:
          type: string
          enum: [INR]
        expiresAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
