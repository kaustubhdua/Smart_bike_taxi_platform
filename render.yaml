# Render hosts only the static React frontend. RideForge's API and database are Supabase-native.
previews:
  generation: off

services:
  - type: web
    name: rideforge-web
    runtime: static
    branch: main
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ghcufcegfvvjhsnqnrzr.supabase.co/functions/v1/rideforge-api
