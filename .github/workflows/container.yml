name: Container build and Compose validation

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/container.yml"

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: local-ci-password-not-for-production
      DATABASE_URL: postgresql://rideforge:local-ci-password-not-for-production@db:5432/rideforge
      RIDEFORGE_USER_AGENT: RideForgeContainerCI/0.1 (https://github.com/kaustubhdua/Smart_bike_taxi_platform)
      RIDEFORGE_JWT_SECRET: local-ci-secret-that-must-never-be-used-in-production-123456
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation
        run: docker compose config --quiet
      - name: Build backend API, outbox worker and admin bootstrap image
        run: docker build --tag rideforge-backend-ci:latest ./backend
      - name: Build web image
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8080 --tag rideforge-web-ci:latest ./web
      - name: Start the complete Compose stack and smoke-test readiness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose up --build --detach
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/ready >/tmp/rideforge-ready.json; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "API never reached schema readiness"
            docker compose ps
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/rideforge-ready.json
          curl --silent --show-error --fail http://127.0.0.1:8080/api/v1/health | grep -q '"database":"connected"'
          curl --silent --show-error --fail http://127.0.0.1:5173/ | grep -qi '<!doctype html'
          docker compose ps
