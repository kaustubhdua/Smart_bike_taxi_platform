name: C++ build and tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            package: g++
          - compiler: clang++
            package: clang
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install compiler and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }} cmake
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  reproducible-benchmark:
    name: Build deterministic benchmark dataset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure release benchmark
        run: cmake -S . -B build-bench -DSMART_BIKE_TAXI_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build benchmark
        run: cmake --build build-bench --target smart_bike_taxi_benchmark --parallel
      - name: Run benchmark and capture CSV
        run: ./build-bench/smart_bike_taxi_benchmark 1000 1000 > benchmark-results.csv
      - name: Upload raw benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-benchmark-${{ github.sha }}
          path: benchmark-results.csv
          if-no-files-found: error
          retention-days: 30
