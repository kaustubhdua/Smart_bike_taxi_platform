name: PostgreSQL migration smoke test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "README.md"
      - "docs/**"
      - ".env.production.example"
      - "compose.production.yaml"
      - "Caddyfile"
      - "deployment/**"
      - ".github/workflows/db-migration.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "README.md"
      - "docs/**"
      - ".env.production.example"
      - "compose.production.yaml"
      - "Caddyfile"
      - "deployment/**"
      - ".github/workflows/db-migration.yml"

permissions:
  contents: read

jobs:
  migration:
    name: Apply schema and verify integrity constraints
    timeout-minutes: 5
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rideforge_test
          POSTGRES_USER: rideforge
          POSTGRES_PASSWORD: rideforge_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideforge -d rideforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      DATABASE_URL: postgresql://rideforge:rideforge_test_password@127.0.0.1:5432/rideforge_test
      PGPORT: 5432
      PGDATABASE: rideforge_test
      PGUSER: rideforge
      PGPASSWORD: rideforge_test_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify Render runtime database URL construction
        run: bash backend/tests/render_database_url_test.sh
      - name: Create Supabase compatibility roles for local PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN"
      - name: Generate ephemeral runtime-role password
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$password"
          printf 'RIDEFORGE_APP_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Apply all migrations
        env:
          RIDEFORGE_MIGRATIONS_DIR: backend/migrations
        run: sh backend/scripts/migrate-if-needed.sh
      - name: Verify migration runner is idempotent
        env:
          RIDEFORGE_MIGRATIONS_DIR: backend/migrations
        run: sh backend/scripts/migrate-if-needed.sh
      - name: Verify driver approval, uniqueness, outbox and support schema
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/tests/schema_smoke.sql
          psql -v ON_ERROR_STOP=1 -tAc "SELECT version FROM schema_migrations WHERE version = '002_driver_approval_and_outbox'" | grep -Fx '002_driver_approval_and_outbox'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT version FROM schema_migrations WHERE version = '004_support_reports'" | grep -Fx '004_support_reports'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT version FROM schema_migrations WHERE version = '013_runtime_role_sequence_least_privilege'" | grep -Fx '013_runtime_role_sequence_least_privilege'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT version FROM schema_migrations WHERE version = '014_lock_down_public_function_execution_defaults'" | grep -Fx '014_lock_down_public_function_execution_defaults'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT version FROM schema_migrations WHERE version = '015_create_readonly_backup_role'" | grep -Fx '015_create_readonly_backup_role'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_trigger WHERE tgname = 'ride_event_notification_outbox' AND NOT tgisinternal" | grep -Fx '1'
      - name: Verify public data API lockdown, private runtime role and FK indexes
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity" | grep -Fx '0'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_tables t WHERE schemaname = 'public' AND (has_table_privilege('anon', format('%I.%I', schemaname, tablename), 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER') OR has_table_privilege('authenticated', format('%I.%I', schemaname, tablename), 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'))" | grep -Fx '0'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'S' AND (has_sequence_privilege('anon', c.oid, 'USAGE,SELECT,UPDATE') OR has_sequence_privilege('authenticated', c.oid, 'USAGE,SELECT,UPDATE'))" | grep -Fx '0'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'S' AND has_sequence_privilege('rideforge_app', c.oid, 'UPDATE')" | grep -Fx '0'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT prosecdef AND proconfig @> ARRAY['search_path=pg_catalog, public'] FROM pg_proc WHERE oid = 'public.enqueue_ride_event_notification()'::regprocedure" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT rolcanlogin AND rolbypassrls AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND rolpassword IS NOT NULL AND has_database_privilege('rideforge_app', current_database(), 'CONNECT') FROM pg_roles WHERE rolname = 'rideforge_app'" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT has_table_privilege('rideforge_app','public.accounts','SELECT,INSERT,UPDATE,DELETE') AND NOT has_table_privilege('rideforge_app','public.accounts','TRUNCATE')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname IN ('admin_audit_events_actor_id_idx','booking_idempotency_ride_id_idx','driver_profiles_approved_by_idx','ride_event_outbox_ride_id_idx','ride_events_actor_id_idx','support_reports_resolved_by_idx','support_reports_ride_id_idx','ride_offers_one_active_per_driver')" | grep -Fx '8'
      - name: Verify public function execution defaults are locked down
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE FUNCTION public.__rideforge_default_acl_probe() RETURNS integer LANGUAGE sql AS 'SELECT 1'"
          psql -v ON_ERROR_STOP=1 -tAc "SELECT NOT has_function_privilege('anon', 'public.__rideforge_default_acl_probe()', 'EXECUTE') AND NOT has_function_privilege('authenticated', 'public.__rideforge_default_acl_probe()', 'EXECUTE') AND NOT has_function_privilege('service_role', 'public.__rideforge_default_acl_probe()', 'EXECUTE')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -c "DROP FUNCTION public.__rideforge_default_acl_probe()"
      - name: Verify disabled read-only backup role and future grants
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "SELECT NOT rolcanlogin AND rolbypassrls AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND rolpassword IS NULL FROM pg_authid WHERE rolname = 'rideforge_backup'" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT has_table_privilege('rideforge_backup','public.accounts','SELECT') AND NOT has_table_privilege('rideforge_backup','public.accounts','INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT has_sequence_privilege('rideforge_backup','public.ride_events_id_seq','USAGE,SELECT') AND NOT has_sequence_privilege('rideforge_backup','public.ride_events_id_seq','UPDATE')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.__rideforge_backup_acl_probe (id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY)"
          psql -v ON_ERROR_STOP=1 -tAc "SELECT has_table_privilege('rideforge_backup','public.__rideforge_backup_acl_probe','SELECT') AND NOT has_table_privilege('rideforge_backup','public.__rideforge_backup_acl_probe','INSERT,UPDATE,DELETE,TRUNCATE')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -tAc "SELECT has_sequence_privilege('rideforge_backup',pg_get_serial_sequence('public.__rideforge_backup_acl_probe','id'),'USAGE,SELECT') AND NOT has_sequence_privilege('rideforge_backup',pg_get_serial_sequence('public.__rideforge_backup_acl_probe','id'),'UPDATE')" | grep -Fx 't'
          psql -v ON_ERROR_STOP=1 -c "DROP TABLE public.__rideforge_backup_acl_probe"
      - name: Verify runtime role password authentication
        shell: bash
        run: |
          set -euo pipefail
          encoded_password="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RIDEFORGE_APP_PASSWORD"], safe=""))')"
          runtime_url="postgresql://rideforge_app:${encoded_password}@127.0.0.1:5432/rideforge_test"
          psql "$runtime_url" -v ON_ERROR_STOP=1 -tAc "SELECT current_user, has_table_privilege(current_user,'public.accounts','SELECT,INSERT,UPDATE,DELETE') AND NOT has_table_privilege(current_user,'public.accounts','TRUNCATE')" | grep -F 'rideforge_app|t'
      - name: Verify backup and restore into a fresh database
        run: sh backend/tests/backup_restore_smoke.sh
