name: Full release readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp:
    name: C++ tests and benchmarks
    uses: ./.github/workflows/cpp.yml
  api:
    name: API build and HTTP smoke
    uses: ./.github/workflows/backend.yml
  database:
    name: PostgreSQL migration and recovery
    uses: ./.github/workflows/db-migration.yml
  web:
    name: Web build, accessibility and browser tests
    uses: ./.github/workflows/web.yml
  containers:
    name: Container and Compose validation
    uses: ./.github/workflows/container.yml
  container_security:
    name: Container vulnerability scan
    uses: ./.github/workflows/container-scan.yml
  codeql:
    name: CodeQL security analysis
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/codeql.yml
  dependency_audit:
    name: npm dependency audit
    uses: ./.github/workflows/dependency-review.yml
