name: C++ API build and smoke tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saarthi_test
          POSTGRES_USER: saarthi
          POSTGRES_PASSWORD: saarthi_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saarthi -d saarthi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://saarthi:saarthi_test_password@127.0.0.1:5432/saarthi_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: saarthi_test
      PGUSER: saarthi
      PGPASSWORD: saarthi_test_password
      SAARTHI_ALLOWED_ORIGIN: http://localhost:5173
      SAARTHI_USER_AGENT: SaarthiGithubActionsSmoke/0.1 (https://github.com/kaustubhdua/Smart_bike_taxi_platform)
      SAARTHI_GEOCODING_URL: http://127.0.0.1:8090/search
      SAARTHI_ROUTING_URL: http://127.0.0.1:8090/route/v1/driving
      SAARTHI_JWT_SECRET: not-a-production-secret-please-override-32chars
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libboost-dev libcurl4-openssl-dev libpq-dev libssl-dev nlohmann-json3-dev postgresql-client curl
      - name: Configure API
        run: cmake -S backend -B build-backend -DCMAKE_BUILD_TYPE=Debug
      - name: Build API with warnings as errors
        run: cmake --build build-backend --parallel
      - name: Run C++ unit tests
        run: ctest --test-dir build-backend --output-on-failure
      - name: Apply versioned database migration
        env:
          SAARTHI_SCHEMA_FILE: backend/migrations/001_initial_schema.sql
        run: sh backend/scripts/migrate-if-needed.sh
      - name: Verify migration runner idempotency
        env:
          SAARTHI_SCHEMA_FILE: backend/migrations/001_initial_schema.sql
        run: sh backend/scripts/migrate-if-needed.sh
      - name: Seed deterministic quote fixtures
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/seed_quotes.sql
      - name: Start API and verify HTTP behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/tests/mock_routing_provider.py > /tmp/saarthi-provider.log 2>&1 &
          provider_pid=$!
          for attempt in $(seq 1 10); do
            if curl --silent --fail 'http://127.0.0.1:8090/search?q=Readiness' >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail 'http://127.0.0.1:8090/search?q=Readiness' >/dev/null
          ./build-backend/saarthi_api > /tmp/saarthi-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$provider_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/saarthi-api.log
              exit 1
            fi
            sleep 1
          done
          if ! SAARTHI_TEST_BASE_URL=http://127.0.0.1:8080 bash -x backend/tests/http_smoke.sh; then
            echo "API server log:"
            cat /tmp/saarthi-api.log
            echo "Mock provider log:"
            cat /tmp/saarthi-provider.log
            exit 1
          fi
      - name: Verify migration invariants
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/schema_smoke.sql
