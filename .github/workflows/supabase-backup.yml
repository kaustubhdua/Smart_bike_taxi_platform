name: Supabase encrypted backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rideforge-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, restore-test and encrypt RideForge database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      restore-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-only-password
          POSTGRES_DB: rideforge_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rideforge_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Install PostgreSQL client and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client gnupg

      - name: Create, encrypt and verify the logical backup
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.RIDEFORGE_BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.RIDEFORGE_BACKUP_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${DATABASE_URL:?Missing RIDEFORGE_BACKUP_DATABASE_URL repository secret}"
          : "${PASSPHRASE:?Missing RIDEFORGE_BACKUP_PASSPHRASE repository secret}"
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "Backup URL must be a PostgreSQL URI." >&2; exit 2 ;;
          esac
          [[ "$DATABASE_URL" == *"rideforge_backup."* ]] || { echo "Use the dedicated rideforge_backup database role." >&2; exit 2; }
          [[ "$DATABASE_URL" == *":5432/"* ]] || { echo "Use the Supabase Session pooler on port 5432." >&2; exit 2; }
          [[ "$DATABASE_URL" == *"sslmode=require"* ]] || { echo "Require sslmode=require in the connection URI." >&2; exit 2; }

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="$workdir/rideforge-$stamp.dump"
          encrypted="$GITHUB_WORKSPACE/backup-artifact/rideforge-$stamp.dump.gpg"
          verified="$workdir/verified.dump"

          mkdir -p "$GITHUB_WORKSPACE/backup-artifact"
          PGCONNECT_TIMEOUT=10 PGSSLMODE=require pg_dump \
            --schema=public --format=custom --no-owner --no-acl \
            --file="$dump" "$DATABASE_URL"
          test -s "$dump"

          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 --passphrase-fd 0 \
            --output "$encrypted" "$dump"
          test -s "$encrypted"

          printf '%s' "$PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --decrypt --passphrase-fd 0 --output "$verified" "$encrypted"
          pg_restore --list "$verified" > "$workdir/archive.list"
          grep -q "TABLE public accounts" "$workdir/archive.list"

          # Prove the encrypted archive can actually restore into a disposable
          # PostgreSQL 17 database. Supabase-managed auth roles/schema are
          # intentionally outside this public-schema backup, so provide only
          # the minimum local compatibility objects needed by RLS policies.
          for attempt in $(seq 1 30); do
            if PGPASSWORD=restore-only-password pg_isready -h 127.0.0.1 -p 5432 -U postgres -d rideforge_restore; then
              break
            fi
            sleep 2
          done
          PGPASSWORD=restore-only-password psql \
            "postgresql://postgres:restore-only-password@127.0.0.1:5432/rideforge_restore?sslmode=disable" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $ SELECT NULL::uuid $;
          SQL

          PGPASSWORD=restore-only-password pg_restore \
            --exit-on-error --no-owner --no-acl \
            --dbname="postgresql://postgres:restore-only-password@127.0.0.1:5432/rideforge_restore?sslmode=disable" \
            "$verified"

          PGPASSWORD=restore-only-password psql \
            "postgresql://postgres:restore-only-password@127.0.0.1:5432/rideforge_restore?sslmode=disable" \
            -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN
                (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE') >= 14
                AND EXISTS (SELECT 1 FROM public.schema_migrations)
                AND (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                     WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity) >= 14
              THEN 'restore-verified' ELSE 'restore-verification-failed' END;
            " | grep -qx 'restore-verified'

          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "Encrypted backup restored and verified in disposable PostgreSQL 17; plaintext is not uploaded."

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: rideforge-supabase-backup-${{ github.run_id }}
          path: backup-artifact/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
