name: Validate backup workflow definitions

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/supabase-backup.yml"
      - ".github/workflows/supabase-restore-drill.yml"
      - ".github/workflows/validate-backup-workflows.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-backup.yml"
      - ".github/workflows/supabase-restore-drill.yml"
      - ".github/workflows/validate-backup-workflows.yml"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint backup and restore workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax, expressions and action inputs
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/supabase-backup.yml .github/workflows/supabase-restore-drill.yml .github/workflows/validate-backup-workflows.yml
