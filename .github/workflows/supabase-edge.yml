name: Supabase Edge API
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-rebuild:
    name: Rebuild Supabase schema and assert security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply every committed migration from an empty database
        run: supabase db reset --yes
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Assert schema, RLS, function grants and trigger invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ci_invariants.sql
      - name: Exercise atomic driver offer transitions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/dispatch_offer_transactions.sql
      - name: Race accept and decline for the same driver offer
        run: bash supabase/tests/dispatch_accept_decline_race.sh
  edge-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/rideforge-api/index.ts
      - name: Test hosted client-IP trust boundary
        run: deno test supabase/functions/rideforge-api/client_ip_test.ts
      - name: Test geocoding provider adapters and coordinate validation
        run: deno test supabase/functions/rideforge-api/geocoding_test.ts
      - name: Test exact-origin CORS policy
        run: deno test supabase/functions/rideforge-api/cors_test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Verify production Vercel CORS preflight
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://smart-bike-taxi-platform.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            'https://ghcufcegfvvjhsnqnrzr.supabase.co/functions/v1/rideforge-api/api/v1/auth/login')"
          test "$status" = "204"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://smart-bike-taxi-platform\.vercel\.app[[:space:]]*$' "$headers"
          grep -Eiq '^access-control-allow-methods:.*POST' "$headers"
          echo "Production Vercel CORS preflight returned HTTP $status with the exact allowed origin."
      - name: Smoke-test live Supabase API readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://ghcufcegfvvjhsnqnrzr.supabase.co/functions/v1/rideforge-api/api/v1/ready
