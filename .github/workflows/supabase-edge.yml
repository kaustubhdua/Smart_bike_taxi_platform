name: Supabase Edge API
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-rebuild:
    name: Rebuild Supabase schema and assert security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply every committed migration from an empty database
        run: supabase db reset --local --yes
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Assert schema, RLS, function grants and trigger invariants
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ci_invariants.sql
  edge-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/rideforge-api/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Smoke-test live Supabase API readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://ghcufcegfvvjhsnqnrzr.supabase.co/functions/v1/rideforge-api/api/v1/ready
